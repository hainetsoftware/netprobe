[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "3.1.0"
description = "Advanced LAN & Internet Intelligence and Physical Estimation Suite"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dnspython>=2.6.0",
    "psutil>=5.9.0",
    "zeroconf>=0.130.0",
    "hypothesis>=6.80.0",
    "textual>=0.85.0",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.80.0",
]
