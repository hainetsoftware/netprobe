[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netprobe"
version = "3.1.0"
description = "Advanced LAN & Internet Intelligence and Physical Estimation Suite"
readme = "README.md"
requires-python = ">=3.8.1"
dependencies = [
    "dnspython==2.6.1; python_version < '3.9'",
    "dnspython>=2.6.0; python_version >= '3.9'",
    "psutil==5.9.8; python_version < '3.9'",
    "psutil>=5.9.0; python_version >= '3.9'",
    "zeroconf==0.130.0; python_version < '3.9'",
    "zeroconf>=0.130.0; python_version >= '3.9'",
    "textual==0.89.1; python_version < '3.9'",
    "textual>=0.89.1; python_version >= '3.9'",
]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.80.0",
]
